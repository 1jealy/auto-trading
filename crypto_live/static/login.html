<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <title>PIN 입력 · 코인 모니터</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login">
    <img src="/icons/icon-192.png" width="56" height="56" alt="" class="login-icon">
    <h1>코인 모니터</h1>
    <p class="login-note">이 컴퓨터에 띄운 앱입니다. 실행 창에 나온 6자리 PIN을 입력하세요.</p>
    <form method="post" action="/login" class="login-form">
      <label for="pin">PIN</label>
      <input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="12" required autofocus>
      <input type="hidden" name="next" id="next" value="/account.html">
      <p class="login-err" id="err" role="alert" hidden></p>
      <button type="submit" class="btn-primary">들어가기</button>
    </form>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const next = q.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) document.getElementById("next").value = next;
    const err = q.get("err");
    if (err) {
      const box = document.getElementById("err");
      box.textContent = err === "locked"
        ? "여러 번 틀려서 5분 동안 잠겼습니다. 잠시 뒤 다시 시도하세요."
        : "PIN이 맞지 않습니다. 실행 창에 나온 숫자를 다시 확인하세요.";
      box.hidden = false;
    }
  </script>
</body>
</html>
