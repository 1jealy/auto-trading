[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade"
version = "0.1.0"
description = "개인용 주식 자동매매 연구 (백테스트 단계)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "finance-datareader>=0.9.50",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "streamlit>=1.46",
    "requests>=2.31",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
